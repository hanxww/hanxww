<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d">
<title id="t">HANXWW — developer profile</title>
<desc id="d">Cinematic dark developer profile hero with terminal interface, grid, stars and cyan-violet accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030508"/>
    <stop offset=".44" stop-color="#090D13"/>
    <stop offset="1" stop-color="#0D1117"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#58A6FF"/>
    <stop offset=".48" stop-color="#A371F7"/>
    <stop offset="1" stop-color="#2DD4BF"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(260 95) rotate(28) scale(620 390)">
    <stop stop-color="#1F6FEB" stop-opacity=".28"/>
    <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1220 485) rotate(-150) scale(520 340)">
    <stop stop-color="#8957E5" stop-opacity=".24"/>
    <stop offset="1" stop-color="#8957E5" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
    <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity=".03"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>

<rect width="1400" height="560" rx="34" fill="url(#bg)"/>
<rect width="1400" height="560" rx="34" fill="url(#grid)"/>
<rect width="1400" height="560" rx="34" fill="url(#glowA)"/>
<rect width="1400" height="560" rx="34" fill="url(#glowB)"/>

<g opacity=".7">
  <circle cx="118" cy="90" r="2" fill="#58A6FF"/>
  <circle cx="1270" cy="118" r="2" fill="#A371F7"/>
  <circle cx="1172" cy="72" r="1.5" fill="#2DD4BF"/>
  <circle cx="1318" cy="330" r="2" fill="#58A6FF"/>
  <circle cx="865" cy="92" r="1.5" fill="#ffffff"/>
  <circle cx="1000" cy="478" r="1.5" fill="#ffffff"/>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace">
  <text x="72" y="78" fill="#8B949E" font-size="16" font-weight="700" letter-spacing="3">HANXWW // PROFILE.OS</text>
  <circle cx="1278" cy="72" r="6" fill="#3FB950"/>
  <text x="1296" y="78" fill="#8B949E" font-size="14" font-weight="700">ONLINE</text>

  <text x="72" y="206" fill="#F0F6FC" font-size="104" font-weight="900" letter-spacing="9">HANXWW</text>
  <rect x="72" y="230" width="660" height="4" rx="2" fill="url(#edge)"/>

  <text x="72" y="286" fill="#C9D1D9" font-size="23" font-weight="800" letter-spacing="2">DEVELOPER · BUILDER · OPEN SOURCE</text>
  <text x="72" y="328" fill="#8B949E" font-size="18">I build tools that make complex workflows feel obvious.</text>

  <g transform="translate(72 380)">
    <rect width="182" height="46" rx="23" fill="#58A6FF" fill-opacity=".08" stroke="#58A6FF" stroke-opacity=".35"/>
    <text x="28" y="29" fill="#DCE6EF" font-size="14" font-weight="800">LOCAL-FIRST</text>
    <rect x="194" width="172" height="46" rx="23" fill="#A371F7" fill-opacity=".08" stroke="#A371F7" stroke-opacity=".34"/>
    <text x="224" y="29" fill="#DCE6EF" font-size="14" font-weight="800">OPEN SOURCE</text>
    <rect x="378" width="142" height="46" rx="23" fill="#2DD4BF" fill-opacity=".07" stroke="#2DD4BF" stroke-opacity=".32"/>
    <text x="414" y="29" fill="#DCE6EF" font-size="14" font-weight="800">SHIPPING</text>
  </g>

  <text x="72" y="480" fill="#58A6FF" font-size="16" font-weight="700">$</text>
  <text x="96" y="480" fill="#8B949E" font-size="16">build --understand --refine --ship</text>
  <rect x="421" y="463" width="10" height="20" rx="2" fill="#C9D1D9">
    <animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(930 132)">
    <rect width="390" height="282" rx="22" fill="#070A0F" fill-opacity=".88" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="1" y="1" width="388" height="40" rx="21" fill="#0D1117"/>
    <circle cx="22" cy="21" r="5" fill="#FF7B72"/>
    <circle cx="40" cy="21" r="5" fill="#D29922"/>
    <circle cx="58" cy="21" r="5" fill="#3FB950"/>
    <text x="82" y="26" fill="#8B949E" font-size="12">~/hanxww</text>

    <text x="24" y="78" fill="#8B949E" font-size="14">$ whoami</text>
    <text x="24" y="104" fill="#F0F6FC" font-size="16" font-weight="800">hanxww</text>

    <text x="24" y="143" fill="#8B949E" font-size="14">$ current_focus</text>
    <text x="24" y="169" fill="#58A6FF" font-size="15" font-weight="700">developer tooling</text>
    <text x="24" y="193" fill="#A371F7" font-size="15" font-weight="700">desktop software</text>
    <text x="24" y="217" fill="#2DD4BF" font-size="15" font-weight="700">local-first systems</text>

    <text x="24" y="254" fill="#8B949E" font-size="13">status:</text>
    <text x="88" y="254" fill="#3FB950" font-size="13" font-weight="800">BUILDING</text>
  </g>
</g>

<rect x=".5" y=".5" width="1399" height="559" rx="33.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>