    <rect x="24" y="199" width="342" height="6" rx="3" fill="#161B22"/><rect x="24" y="199" width="277" height="6" rx="3" fill="#2DD4BF"/>
    <text x="24" y="238" fill="#8B949E" font-size="12">winner selected by your checks, not vibes.</text>
