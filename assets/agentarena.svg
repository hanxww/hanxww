    <rect x="306" width="172" height="38" rx="19" fill="#2DD4BF" fill-opacity=".07" stroke="#2DD4BF" stroke-opacity=".28"/>
    <text x="334" y="25" fill="#C9D1D9" font-size="12" font-weight="800">0 RUNTIME DEPS</text>
  </g>

  <text x="62" y="350" fill="#58A6FF" font-size="14" font-weight="800">CODEX · CLAUDE CODE · GEMINI CLI · OPENCODE · CUSTOM AGENTS</text>

  <g transform="translate(914 78)">
    <rect width="414" height="264" rx="20" fill="#05070A" stroke="#fff" stroke-opacity=".08"/>
    <text x="24" y="38" fill="#8B949E" font-size="13">$ agentarena run --task "fix issue"</text>
    <text x="24" y="78" fill="#58A6FF" font-size="14" font-weight="800">01  CODEX</text>
    <text x="318" y="78" fill="#3FB950" font-size="14" font-weight="800">92</text>
    <rect x="24" y="91" width="342" height="6" rx="3" fill="#161B22"/><rect x="24" y="91" width="315" height="6" rx="3" fill="#58A6FF"/>
    <text x="24" y="132" fill="#A371F7" font-size="14" font-weight="800">02  CLAUDE</text>
    <text x="318" y="132" fill="#C9D1D9" font-size="14" font-weight="800">88</text>
    <rect x="24" y="145" width="342" height="6" rx="3" fill="#161B22"/><rect x="24" y="145" width="301" height="6" rx="3" fill="#A371F7"/>
    <text x="24" y="186" fill="#2DD4BF" font-size="14" font-weight="800">03  GEMINI</text>
