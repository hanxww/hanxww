<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace">
  <text x="62" y="62" fill="#8B949E" font-size="15" font-weight="800" letter-spacing="2">FEATURED PROJECT / 01</text>
  <text x="62" y="130" fill="#F0F6FC" font-size="56" font-weight="900">AgentArena</text>
  <text x="62" y="174" fill="#C9D1D9" font-size="21">Make coding agents compete on your repository.</text>
  <text x="62" y="217" fill="#8B949E" font-size="15">same task → isolated worktrees → real checks → ranked result → review → apply</text>

  <g transform="translate(62 266)">
    <rect width="122" height="38" rx="19" fill="#58A6FF" fill-opacity=".08" stroke="#58A6FF" stroke-opacity=".3"/>
