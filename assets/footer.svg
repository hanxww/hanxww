<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" role="img" aria-label="Keep building — HANXWW open source profile footer">
<defs>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090D"/><stop offset=".52" stop-color="#10121A"/><stop offset="1" stop-color="#08090C"/></linearGradient>
<linearGradient id="acid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5FFB9"/><stop offset=".4" stop-color="#CEFF66"/><stop offset="1" stop-color="#67E4C4"/></linearGradient>
<linearGradient id="ultra" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5BE4FF"/><stop offset=".5" stop-color="#A991FF"/><stop offset="1" stop-color="#F276C1"/></linearGradient>
<linearGradient id="split" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#CEFF66"/><stop offset=".55" stop-color="#A991FF"/><stop offset="1" stop-color="#73EAFF"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#CEFF66" stop-opacity=".62"/><stop offset="1" stop-color="#CEFF66" stop-opacity="0"/></linearGradient>
<radialGradient id="glowPurple"><stop stop-color="#A991FF" stop-opacity=".26"/><stop offset="1" stop-color="#A991FF" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGreen"><stop stop-color="#CEFF66" stop-opacity=".19"/><stop offset="1" stop-color="#CEFF66" stop-opacity="0"/></radialGradient>
<radialGradient id="glowCyan"><stop stop-color="#73EAFF" stop-opacity=".18"/><stop offset="1" stop-color="#73EAFF" stop-opacity="0"/></radialGradient>
<pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8B92A0" opacity=".22"/></pattern>
<pattern id="lineGrid" width="62" height="62" patternUnits="userSpaceOnUse"><path d="M62 0H0V62" fill="none" stroke="#CED4E7" stroke-opacity=".055" stroke-width="1"/></pattern>
