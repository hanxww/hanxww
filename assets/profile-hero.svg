<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">HANXWW — Developer profile banner</title>
  <desc id="desc">Dark GitHub profile banner with cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B10"/>
      <stop offset="0.52" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#10151D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(190 55) rotate(28) scale(430 250)">
      <stop stop-color="#2563EB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1030 255) rotate(-150) scale(420 260)">
      <stop stop-color="#7C3AED" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow2)"/>

  <circle cx="1040" cy="70" r="78" fill="#58A6FF" opacity=".055" filter="url(#soft)"/>
  <circle cx="1110" cy="120" r="62" fill="#8B5CF6" opacity=".06" filter="url(#soft)"/>

  <g opacity=".7">
    <path d="M72 72H260" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="72" cy="72" r="4" fill="#58A6FF"/>
    <circle cx="260" cy="72" r="4" fill="#8B5CF6"/>
  </g>

  <text x="72" y="148" fill="#F0F6FC" font-size="72" font-weight="800"
        letter-spacing="8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace">
    HANXWW
  </text>

  <rect x="72" y="174" width="544" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="72" y="218" fill="#8B949E" font-size="18" font-weight="600"
        letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace">
    DEVELOPER  //  BUILDER  //  OPEN SOURCE
  </text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace" font-size="13" font-weight="700">
    <rect x="72" y="252" width="140" height="34" rx="17" fill="#58A6FF" fill-opacity=".09" stroke="#58A6FF" stroke-opacity=".32"/>
    <circle cx="92" cy="269" r="4" fill="#3FB950"/>
    <text x="106" y="274" fill="#C9D1D9">BUILDING</text>

    <rect x="224" y="252" width="166" height="34" rx="17" fill="#8B5CF6" fill-opacity=".08" stroke="#8B5CF6" stroke-opacity=".30"/>
    <text x="246" y="274" fill="#C9D1D9">LOCAL-FIRST</text>

    <rect x="402" y="252" width="150" height="34" rx="17" fill="#2DD4BF" fill-opacity=".07" stroke="#2DD4BF" stroke-opacity=".28"/>
    <text x="424" y="274" fill="#C9D1D9">SHIPPING</text>
  </g>

  <g transform="translate(920 102)" fill="none" stroke-linecap="round">
    <path d="M0 74 C38 30, 74 118, 112 74 S188 30, 226 74" stroke="#58A6FF" stroke-opacity=".42" stroke-width="3"/>
    <path d="M0 102 C38 58, 74 146, 112 102 S188 58, 226 102" stroke="#8B5CF6" stroke-opacity=".32" stroke-width="2"/>
    <circle cx="112" cy="74" r="5" fill="#2DD4BF" stroke="none"/>
  </g>

  <rect x=".5" y=".5" width="1199" height="319" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
